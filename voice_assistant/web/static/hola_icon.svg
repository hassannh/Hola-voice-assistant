<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0d18" />
      <stop offset="100%" stop-color="#07080f" />
    </linearGradient>
    <linearGradient id="neon-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#c084fc" />
      <stop offset="50%" stop-color="#a855f7" />
      <stop offset="100%" stop-color="#22d3ee" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Squircle Base -->
  <rect x="24" y="24" width="464" height="464" rx="100" fill="url(#bg-grad)" stroke="#a855f7" stroke-width="4" stroke-opacity="0.3" />
  
  <!-- Subtle Grid Accent -->
  <path d="M24 160 H488 M24 352 H488 M160 24 V488 M352 24 V488" stroke="#ffffff" stroke-opacity="0.03" stroke-width="1.5" />

  <!-- Antigravity Core Command Icon -->
  <g filter="url(#glow)">
    <path d="M192 192 A48 48 0 1 1 240 144 V368 A48 48 0 1 1 192 320 H320 A48 48 0 1 1 272 368 V144 A48 48 0 1 1 320 192 Z"
          fill="none"
          stroke="url(#neon-grad)"
          stroke-width="36"
          stroke-linecap="round"
          stroke-linejoin="round" />
  </g>

  <!-- Cyan Sparkle Dot -->
  <circle cx="256" cy="256" r="10" fill="#22d3ee" filter="url(#glow)" />
</svg>
